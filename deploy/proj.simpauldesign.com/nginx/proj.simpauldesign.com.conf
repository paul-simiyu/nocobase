# proj.simpauldesign.com — Tender Radar platform
#
# Install as /etc/nginx/sites-available/proj.simpauldesign.com.conf and symlink
# into sites-enabled, or drop into /etc/nginx/conf.d/. Then:
#   nginx -t && systemctl reload nginx
#
# Logging deliberately uses nginx's default `combined` format. NocoBase's own
# docker/nocobase/nocobase-docs.conf defines a `log_format apm2`; redefining a
# log_format of the same name elsewhere in the http context makes nginx refuse
# to start, so this file defines none.

# Required by the WebSocket proxying below: it turns the Upgrade request header
# into the right Connection value, and "" for ordinary requests. It must sit in
# the http context, which is where conf.d/ and sites-enabled/ files are included.
#
# If another site on this host already defines $connection_upgrade, nginx will
# refuse to start with a duplicate-map error — delete this block in that case.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tender_radar_app {
    # docker-compose publishes the container's port 80 on loopback only.
    server 127.0.0.1:13000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name proj.simpauldesign.com;

    # Leave ACME reachable over plain HTTP so renewals do not depend on the
    # certificate they are renewing.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is enabled on the listen line rather than with the newer
    # `http2 on;` directive, which does not exist before nginx 1.25.1 and makes
    # 1.24 — what Ubuntu 24.04 LTS ships — refuse to start. On 1.25.1+ this form
    # still works and logs a deprecation warning; switch it there if you prefer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proj.simpauldesign.com;

    # A wildcard for *.simpauldesign.com covers this host: it is three labels,
    # and a wildcard matches exactly one. It would NOT cover a four-label
    # www.proj.simpauldesign.com — serve any such name as a redirect from the
    # edge rather than as a second origin.
    ssl_certificate     /etc/letsencrypt/live/simpauldesign.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simpauldesign.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/proj.simpauldesign.com.access.log combined;
    error_log  /var/log/nginx/proj.simpauldesign.com.error.log;

    charset utf-8;

    # NocoBase uploads attachments and restores backups through the app, and
    # both can be large. The upstream config uses 0 (unlimited) for the same
    # reason; cap it instead if this host is exposed to untrusted users.
    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://tender_radar_app;
        proxy_http_version 1.1;

        # NocoBase pushes in-app notifications over a WebSocket. Without these
        # two headers the app still loads and then quietly never updates, which
        # is a confusing failure to diagnose after the fact.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app builds http:// URLs behind an https:// edge.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        proxy_redirect off;

        # A harvest sweeps several portals in one request and can outlast the
        # 60s default, which would surface as a 504 with the run still going.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
